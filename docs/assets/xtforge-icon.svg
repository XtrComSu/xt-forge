<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#141e30"/>
    </linearGradient>
    <linearGradient id="hexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded badge -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Geometric Forge Hexagon -->
  <polygon points="256,72 414,164 414,348 256,440 98,348 98,164"
           fill="#0f172a" stroke="url(#hexStroke)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Subtle internal circuit frame -->
  <polygon points="256,102 388,179 388,333 256,410 124,333 124,179"
           fill="none" stroke="#1e3a5f" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Bold Stylized X / Anvil Strikes -->
  <path d="M168 176 L236 256 L168 336 L206 336 L256 278 L306 336 L344 336 L276 256 L344 176 L306 176 L256 234 L206 176 Z"
        fill="url(#bladeGrad)"/>

  <!-- Cyan precision bar (call-graph / binary blade highlight) -->
  <rect x="220" y="352" width="72" height="12" rx="6" fill="#22d3ee"/>

  <!-- Amber forge spark diamond -->
  <polygon points="256,126 274,154 256,182 238,154" fill="url(#sparkGrad)"/>
  <circle cx="352" cy="158" r="7" fill="#22d3ee"/>
  <circle cx="160" cy="158" r="7" fill="#f59e0b"/>
</svg>
