[package]
name = "xtforge-native"
version = "0.1.0"
edition = "2021"
description = "Native CLI core for xt-forge (P1: flash, route, compress)"

[dependencies]
serde_json = "1"
sha2 = "0.10"
regex = "1"
libc = "0.2"
rusqlite = "0.32"
unicode-normalization = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1
